<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:;">
  <title>SEO 이미지 최적화</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
      </div>
      <button id="minimizeModeBtn" class="minimize-mode-btn" title="최소화 모드">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="9"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
      </button>
      <div class="upload-dir-info">
        <span class="upload-dir-label">저장 폴더:</span>
        <span id="uploadDirPath" class="upload-dir-path">로딩 중...</span>
      </div>
    </div>

    <div id="webServerSection" class="web-server-section">
      <div class="web-server-info">
        <h3>📱 스마트폰 업로드</h3>
        <div class="web-server-details">
          <div class="web-server-urls">
            <div class="web-server-url">
              <span class="url-label">WiFi:</span>
              <a id="wifiServerUrl" href="#" target="_blank" class="url-link" title="WiFi 접속 주소"></a>
            </div>
            <div class="web-server-url">
              <span class="url-label">외부:</span>
              <a id="externalServerUrl" href="#" target="_blank" class="url-link" title="외부 접속 주소"></a>
            </div>
          </div>
          <div class="web-server-qr">
            <img id="webServerQR" alt="QR Code" class="qr-code">
          </div>
        </div>
      </div>
    </div>

    <div id="dropZone" class="drop-zone">
      <div class="drop-zone-content">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <p class="drop-text">이미지를 여기에 드래그 앤 드롭</p>
        <p class="drop-subtext">또는 클릭하여 파일 선택</p>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden" aria-label="이미지 파일 선택">
    </div>

    <div class="folder-watch-section">
      <button id="selectFolderBtn" class="btn btn-secondary">폴더 감시 시작</button>
      <div id="folderWatchStatus" class="folder-watch-status"></div>
    </div>

    <div class="options-section">
      <label class="option-label">
        <input type="checkbox" id="cornerCrop">
        모서리 크롭
      </label>
      <label class="option-label">
        <input type="checkbox" id="cornerRadius">
        모서리 둥글게
      </label>
    </div>

    <div id="progressSection" class="progress-section hidden">
      <div class="progress-header">
        <h3>처리 중...</h3>
        <span id="progressCount" class="progress-count">0 / 0</span>
      </div>
      
      <div class="overall-progress">
        <div class="progress-bar">
          <div id="overallProgressBar" class="progress-bar-fill"></div>
        </div>
        <span id="overallProgressText" class="progress-text">0%</span>
      </div>

      <div class="current-file">
        <p id="currentFileName" class="current-file-name">-</p>
        <p id="currentFileStatus" class="current-file-status">-</p>
      </div>
    </div>

    <div id="resultsSection" class="results-section hidden">
      <h3>처리 완료</h3>
      <div id="resultsList" class="results-list"></div>
      <button id="resetBtn" class="btn btn-primary">다시 시작</button>
    </div>

    <div id="errorSection" class="error-section hidden">
      <h3>오류 발생</h3>
      <p id="errorMessage" class="error-message"></p>
      <button id="errorResetBtn" class="btn btn-primary">다시 시도</button>
    </div>
  </div>

  <!-- 최소화 모드 -->
  <div id="minimizeMode" class="minimize-mode hidden">
    <div id="minimizeDropZone" class="minimize-drop-zone">
      <div class="minimize-dot-container">
        <div class="minimize-dot"></div>
      </div>
      <div class="minimize-label">드롭하세요</div>
      <div class="minimize-options">
        <label class="minimize-option">
          <input type="checkbox" id="minimizeCornerCrop">
          크롭
        </label>
        <label class="minimize-option">
          <input type="checkbox" id="minimizeCornerRadius">
          둥글게
        </label>
      </div>
    </div>
    <div class="minimize-resize-handle"></div>
    <button id="exitMinimizeMode" class="exit-minimize-btn" title="최소화 모드 종료">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- 파일 크기 제한 설정 다이얼로그 -->
  <div id="maxFileSizeDialog" class="dialog-overlay hidden">
    <div class="dialog-content">
      <h3>파일 크기 제한 설정</h3>
      <p class="dialog-subtitle">현재: <span id="currentMaxFileSize">10</span>MB</p>
      <div class="dialog-input">
        <label for="maxFileSizeInput">새로운 제한 (MB):</label>
        <input type="number" id="maxFileSizeInput" min="1" max="1000" step="1" value="10">
      </div>
      <div class="dialog-buttons">
        <button id="cancelMaxFileSize" class="btn btn-secondary">취소</button>
        <button id="saveMaxFileSize" class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>

  <!-- 동영상 주소 설정 다이얼로그 -->
  <div id="videoUrlDialog" class="dialog-overlay hidden">
    <div class="dialog-content">
      <h3>동영상 주소 설정</h3>
      <p class="dialog-subtitle">현재: <span id="currentVideoUrl">설정되지 않음</span></p>
      <div class="dialog-input">
        <label for="videoUrlInput">새로운 동영상 주소 (YouTube embed URL):</label>
        <input type="text" id="videoUrlInput" placeholder="https://www.youtube.com/embed/..." value="">
      </div>
      <div class="dialog-buttons">
        <button id="cancelVideoUrl" class="btn btn-secondary">취소</button>
        <button id="saveVideoUrl" class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
